services:
  postgres:
    image: postgres:16
    container_name: annual-leave-apprenticeship-project-api-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: dev
    tmpfs:
      - /var/lib/postgresql

  annual-leave-apprenticeship-project-api:
    build: .
    container_name: annual-leave-apprenticeship-project-api
    depends_on:
      postgres:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - APP_DB_ENDPOINT=postgres:5432
